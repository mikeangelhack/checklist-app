name: Deploy to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  administration: write
  pages: write
  id-token: write

# Prevent overlapping deploys; a new run supersedes the previous one
concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Configure Pages (enables the site if not yet enabled)
        uses: actions/configure-pages@v5
        with:
          enablement: true

      # upload-pages-artifact cannot exclude files, so assemble a clean
      # artifact containing only what the website serves
      - name: Assemble site artifact
        run: |
          mkdir -p _site
          cp index.html styles.css app.js _site/
          cp -r lib _site/

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: _site

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
