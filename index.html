<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <meta
      name="description"
      content="A small checklist app: plain HTML, CSS, and JavaScript with no build step."
    />
    <title>Checklist</title>
    <link
      rel="icon"
      href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Crect width='32' height='32' rx='7' fill='%235b5bd6'/%3E%3Cpath d='M9 16.5l5 5 9-11' stroke='white' stroke-width='3.5' fill='none' stroke-linecap='round' stroke-linejoin='round'/%3E%3C/svg%3E"
    />
    <link rel="stylesheet" href="./styles.css" />
  </head>
  <body>
    <main class="card">
      <header class="card-header">
        <h1>Checklist</h1>
        <p id="summary" class="summary" role="status">0 of 0 completed</p>
      </header>

      <form id="add-form" class="add-form" autocomplete="off">
        <label class="sr-only" for="new-item-text">New checklist item</label>
        <input
          id="new-item-text"
          name="text"
          type="text"
          placeholder="Add an item, e.g. Send the agenda"
          maxlength="200"
          required
        />
        <button type="submit" class="add-button">Add</button>
      </form>

      <ul id="list" class="list"></ul>

      <p id="empty-state" class="empty-state" hidden>
        Nothing here yet. Add your first item above — it is saved in this
        browser automatically.
      </p>

      <footer class="card-footer">
        <button id="clear-completed" type="button" class="clear-button" disabled>
          Clear completed
        </button>
      </footer>
    </main>

    <script type="module" src="./app.js"></script>
  </body>
</html>
